<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotizador de Productos - Precios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      input.no-spinner::-webkit-outer-spin-button,
      input.no-spinner::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input.no-spinner[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-700 text-white p-4 shadow">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <h1 class="text-xl font-bold">Cotizador de Productos</h1>
        <nav class="flex gap-4 text-sm">
          <a href="index.html" class="px-3 py-1 rounded hover:bg-blue-800">Materias Primas</a>
          <a href="precios.html" class="px-3 py-1 rounded bg-blue-800 hover:bg-blue-900">Precios</a>
          <a href="cotizacion.html" class="px-3 py-1 rounded hover:bg-blue-800">Cotización</a>
          <a href="cotizaciones.html" class="px-3 py-1 rounded hover:bg-blue-800">Guardadas</a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
      <section class="bg-white rounded-lg shadow p-6">
        <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
          <div>
            <h2 class="text-lg font-semibold text-gray-800">Precios por kg</h2>
            <p id="precios-count" class="text-sm text-gray-500"></p>
          </div>
          <form id="form-filtro" class="flex flex-wrap items-end gap-3">
            <div>
              <label for="filtro-buscar" class="block text-sm font-medium text-gray-700 mb-1">Buscar</label>
              <input
                type="text"
                id="filtro-buscar"
                placeholder="nro o descripción"
                class="w-52 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>
            <button
              type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-lg"
            >
              Filtrar
            </button>
          </form>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm divide-y divide-gray-200">
            <thead class="bg-gray-50 text-left text-xs uppercase text-gray-500">
              <tr>
                <th class="px-4 py-3 font-medium">NroID</th>
                <th class="px-4 py-3 font-medium">Descripción</th>
                <th class="px-4 py-3 font-medium text-right">Precio ($/kg · $/u)</th>
                <th class="px-4 py-3 font-medium">Anteriores</th>
                <th class="px-4 py-3 font-medium">Estado</th>
                <th class="px-4 py-3 font-medium text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-precios" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="toast" class="fixed bottom-4 right-4 hidden px-4 py-3 rounded-lg shadow-lg text-white text-sm"></div>

    <script src="precios.js"></script>
  </body>
</html>
