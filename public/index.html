<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotizador de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-700 text-white p-4 shadow">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <h1 class="text-xl font-bold">Cotizador de Productos</h1>
        <nav class="flex gap-4 text-sm">
          <a href="index.html" class="px-3 py-1 rounded hover:bg-blue-800">Materias Primas</a>
          <a href="precios.html" class="px-3 py-1 rounded hover:bg-blue-800">Precios</a>
          <a href="cotizacion.html" class="px-3 py-1 rounded hover:bg-blue-800">Cotización</a>
          <a href="cotizaciones.html" class="px-3 py-1 rounded hover:bg-blue-800">Guardadas</a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
      <!-- Movimientos JVP (CSV, sin DB) -->
      <section class="bg-white rounded-lg shadow p-6">
        <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
          <div>
            <h2 class="text-lg font-semibold text-gray-800">Movimientos JVP 2026-08</h2>
            <p id="jvp-count" class="text-sm text-gray-500"></p>
          </div>
          <form id="form-jvp" class="flex flex-wrap items-end gap-3">
            <div>
              <label for="jvp-buscar" class="block text-sm font-medium text-gray-700 mb-1">Buscar fórmula</label>
              <input
                type="text"
                id="jvp-buscar"
                placeholder="código o nombre"
                class="w-52 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>
            <button
              type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-lg"
            >
              Filtrar
            </button>
          </form>
        </div>
        <div id="lista-formulas" class="divide-y divide-gray-100 border border-gray-200 rounded-lg"></div>
      </section>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 hidden px-4 py-3 rounded-lg shadow-lg text-white text-sm"></div>

    <script src="app.js"></script>
  </body>
</html>
